name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      COVERAGE_THRESHOLD: "0"

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode 26
      run: |
        XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
        sudo xcode-select -s "$XCODE"
        xcodebuild -version

    - name: Pick simulator
      run: |
        DEST=$(scripts/ci-destination.sh)
        echo "Using $DEST"
        echo "DESTINATION=$DEST" >> "$GITHUB_ENV"

    - name: Build and Test
      run: |
        set -o pipefail
        xcodebuild test \
          -project OpenScannerRebuild.xcodeproj \
          -scheme OpenScannerRebuild \
          -destination "$DESTINATION" \
          -resultBundlePath TestResults.xcresult \
          -enableCodeCoverage YES \
          -parallel-testing-enabled NO \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

    - name: Summarize errors and warnings
      if: always()
      run: |
        grep -E "(error|warning): " xcodebuild.log | sort -u | head -200 || true
        grep -E "✘|failed \(|Test Case .* failed|issue at" xcodebuild.log | head -100 || true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results
        path: |
          TestResults.xcresult
          xcodebuild.log
